<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">DEMONZDEV Build Signal</title>
  <desc id="desc">Abstract animated system activity visualization for DEMONZDEV.</desc>

  <defs>
    <pattern id="activityGrid" width="80" height="40" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V40" fill="none" stroke="#9B4DFF" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
    <path id="waveOne" d="M150 75 C245 55 290 92 380 72 S535 58 620 78 S790 92 870 68 S1010 58 1080 76" />
    <path id="waveTwo" d="M150 108 C235 126 320 94 410 112 S565 128 650 105 S820 92 900 115 S1010 126 1080 104" />
    <path id="waveThree" d="M150 141 C250 120 330 150 425 137 S570 120 670 143 S820 153 910 136 S1020 120 1080 140" />
  </defs>

  <rect width="1200" height="200" rx="6" fill="#030204" />
  <rect x="1" y="1" width="1198" height="198" rx="5" fill="url(#activityGrid)" stroke="#7000FF" stroke-opacity="0.32" />

  <g fill="#8A8A8A" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11" letter-spacing="2">
    <text x="32" y="31">SYSTEM ACTIVITY</text>
    <text x="1008" y="31" fill="#9B4DFF">BUILD SIGNAL</text>
  </g>

  <g fill="none" stroke-linecap="round">
    <use xlink:href="#waveOne" stroke="#7000FF" stroke-width="1.2" opacity="0.5" />
    <use xlink:href="#waveTwo" stroke="#9B4DFF" stroke-width="1" opacity="0.34" />
    <use xlink:href="#waveThree" stroke="#7000FF" stroke-width="1.2" opacity="0.42" />
  </g>

  <g fill="#9B4DFF">
    <rect x="184" y="69" width="9" height="9" rx="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.8s" repeatCount="indefinite" /></rect>
    <rect x="270" y="91" width="15" height="7" rx="1"><animate attributeName="opacity" values="0.65;0.15;0.65" dur="5.6s" begin="0.4s" repeatCount="indefinite" /></rect>
    <rect x="352" y="67" width="7" height="13" rx="1"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="4.2s" begin="0.9s" repeatCount="indefinite" /></rect>
    <rect x="478" y="61" width="12" height="8" rx="1"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="6.1s" begin="0.2s" repeatCount="indefinite" /></rect>
    <rect x="596" y="74" width="8" height="12" rx="1"><animate attributeName="opacity" values="0.25;1;0.25" dur="5.1s" begin="1.1s" repeatCount="indefinite" /></rect>
    <rect x="712" y="94" width="14" height="7" rx="1"><animate attributeName="opacity" values="0.65;0.15;0.65" dur="5.8s" begin="0.6s" repeatCount="indefinite" /></rect>
    <rect x="842" y="62" width="8" height="12" rx="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" begin="1.4s" repeatCount="indefinite" /></rect>
    <rect x="980" y="72" width="13" height="8" rx="1"><animate attributeName="opacity" values="0.7;0.18;0.7" dur="6.3s" begin="0.8s" repeatCount="indefinite" /></rect>

    <rect x="218" y="104" width="8" height="12" rx="1"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="5.2s" begin="0.7s" repeatCount="indefinite" /></rect>
    <rect x="326" y="110" width="14" height="7" rx="1"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="6s" begin="1.3s" repeatCount="indefinite" /></rect>
    <rect x="438" y="101" width="8" height="12" rx="1"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.7s" begin="0.3s" repeatCount="indefinite" /></rect>
    <rect x="548" y="116" width="12" height="7" rx="1"><animate attributeName="opacity" values="0.65;0.15;0.65" dur="5.4s" begin="1.6s" repeatCount="indefinite" /></rect>
    <rect x="676" y="98" width="8" height="13" rx="1"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.9s" begin="0.5s" repeatCount="indefinite" /></rect>
    <rect x="804" y="105" width="15" height="7" rx="1"><animate attributeName="opacity" values="0.7;0.18;0.7" dur="6.4s" begin="1s" repeatCount="indefinite" /></rect>
    <rect x="932" y="112" width="8" height="11" rx="1"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="5.7s" begin="0.1s" repeatCount="indefinite" /></rect>

    <rect x="190" y="133" width="14" height="7" rx="1"><animate attributeName="opacity" values="0.65;0.15;0.65" dur="5.9s" begin="1.2s" repeatCount="indefinite" /></rect>
    <rect x="302" y="143" width="8" height="12" rx="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.6s" begin="0.5s" repeatCount="indefinite" /></rect>
    <rect x="388" y="130" width="12" height="8" rx="1"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="6.2s" begin="0.8s" repeatCount="indefinite" /></rect>
    <rect x="520" y="139" width="8" height="13" rx="1"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="5.3s" begin="1.5s" repeatCount="indefinite" /></rect>
    <rect x="642" y="132" width="15" height="7" rx="1"><animate attributeName="opacity" values="0.65;0.15;0.65" dur="6.5s" begin="0.4s" repeatCount="indefinite" /></rect>
    <rect x="772" y="144" width="8" height="11" rx="1"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.8s" begin="1.1s" repeatCount="indefinite" /></rect>
    <rect x="904" y="130" width="13" height="8" rx="1"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="5.5s" begin="0.2s" repeatCount="indefinite" /></rect>
    <rect x="1020" y="139" width="8" height="12" rx="1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="6.1s" begin="1.7s" repeatCount="indefinite" /></rect>
  </g>

  <g fill="#ffffff" opacity="0.9">
    <circle r="3">
      <animateMotion dur="9s" repeatCount="indefinite"><mpath xlink:href="#waveOne" /></animateMotion>
    </circle>
    <circle r="3">
      <animateMotion dur="11s" begin="2.7s" repeatCount="indefinite"><mpath xlink:href="#waveTwo" /></animateMotion>
    </circle>
    <circle r="3">
      <animateMotion dur="13s" begin="5s" repeatCount="indefinite"><mpath xlink:href="#waveThree" /></animateMotion>
    </circle>
  </g>

  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11" letter-spacing="2">
    <text x="32" y="181" fill="#ffffff">BUILDING IN PUBLIC</text>
    <text x="1010" y="181" fill="#9B4DFF">SIGNAL / LIVE</text>
  </g>
</svg>
