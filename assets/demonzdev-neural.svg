  <g fill="#ffffff" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">
    <text x="600" y="228" text-anchor="middle" font-size="56" font-weight="700" letter-spacing="5">DEMONZDEV</text>
    <text x="600" y="268" text-anchor="middle" fill="#b8b0c4" font-size="16" letter-spacing="2">CREATIVE TECHNOLOGIST &amp; PRODUCT ENGINEER</text>
  </g>

  <g fill="#9B4DFF" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" letter-spacing="2">
    <text x="75" y="455">WEB</text>
    <text x="180" y="455">MOBILE</text>
    <text x="315" y="455">AI</text>
    <text x="770" y="455">CREATIVE TECHNOLOGY</text>
  </g>

  <g fill="#ffffff" opacity="1">
    <circle r="4">
      <animateMotion dur="5s" repeatCount="indefinite"><mpath xlink:href="#edge01" /></animateMotion>
    </circle>
    <circle r="4">
      <animateMotion dur="6.5s" begin="1.4s" repeatCount="indefinite"><mpath xlink:href="#edge06" /></animateMotion>
    </circle>
    <circle r="4">
      <animateMotion dur="7s" begin="0.7s" repeatCount="indefinite"><mpath xlink:href="#edge07" /></animateMotion>
    </circle>
    <circle r="4">
      <animateMotion dur="5.8s" begin="2s" repeatCount="indefinite"><mpath xlink:href="#edge09" /></animateMotion>
    </circle>
    <circle r="4">
      <animateMotion dur="6.2s" begin="0.5s" repeatCount="indefinite"><mpath xlink:href="#edge11" /></animateMotion>
    </circle>
    <circle r="4">
      <animateMotion dur="5.4s" begin="1.8s" repeatCount="indefinite"><mpath xlink:href="#edge14" /></animateMotion>
    </circle>
    <circle r="4">
      <animateMotion dur="7.2s" begin="2.5s" repeatCount="indefinite"><mpath xlink:href="#edge15" /></animateMotion>
    </circle>
  </g>
</svg>
