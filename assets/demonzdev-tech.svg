<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">DEMONZDEV Technology System</title>
  <desc id="desc">Animated technology icon strip for Next.js, React, TypeScript, Tailwind CSS, Flutter, Dart, PostgreSQL, Supabase, SQLite, Three.js, Git, and Cloudflare.</desc>

  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7000FF" stop-opacity="0" />
      <stop offset="0.5" stop-color="#9B4DFF" stop-opacity="0.8" />
      <stop offset="1" stop-color="#7000FF" stop-opacity="0" />
    </linearGradient>
    <path id="signalTop" d="M44 86 H1156" />
    <path id="signalBottom" d="M44 178 H1156" />
  </defs>

  <g fill="none" stroke="#7000FF" stroke-width="1" opacity="0.35">
    <use xlink:href="#signalTop" />
    <use xlink:href="#signalBottom" />
  </g>

  <g fill="#9B4DFF" opacity="0.8">
    <circle r="2.5">
      <animateMotion dur="7s" repeatCount="indefinite"><mpath xlink:href="#signalTop" /></animateMotion>
    </circle>
    <circle r="2.5">
      <animateMotion dur="7s" begin="2.8s" repeatCount="indefinite"><mpath xlink:href="#signalBottom" /></animateMotion>
    </circle>
  </g>

